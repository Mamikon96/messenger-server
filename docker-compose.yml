services:
  # Разработка: данные сохраняются в томе.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d messenger']
      interval: 2s
      timeout: 3s
      retries: 20

  # Приёмка и e2e: одноразовая БД в памяти, e2e делают TRUNCATE.
  postgres-test:
    profiles: ['test']
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: messenger_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d messenger_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
